  - id: t09-upc-e
    title: Correct UPC-E parity and expansion
    description: |
      Rewrite only the type === 'E' branch in src/ean/index.ts. After start-guard shift(3) and
      end-guard pop(3), remove the remaining 3 end-guard runs with splice(24); decode six 4-run
      digits; record L for direct UPC_SET lookup and G for reversed lookup. Build a six-bit parity
      value with bit (5-i) set for G/even, then match ZXing UPC-E parity tables:
      NS0 check 0-9 = 0x38,0x34,0x32,0x31,0x2C,0x26,0x23,0x2A,0x29,0x25;
      NS1 check 0-9 = 0x07,0x0B,0x0D,0x0E,0x13,0x19,0x1C,0x15,0x16,0x1A.
      Return the raw 8-digit UPC-E string: NS + six payload digits + check digit. Add
      test/upc-e.test.ts with synthetic lines (3 start runs + 24 digit runs + 6 end-guard runs)
      for all 10 check digits in both number systems, plus invalid parity/guard cases. If a digit or
      parity cannot be resolved, return '' for UPC-E rather than guessing the NS/check digit.
      Do not change EAN-13, EAN-8, or UPC-A outputs.
    wave: 1
    depends_on: []
    agent: gem-implementer
    status: pending
    retries_used: 0
    acceptance_criteria:
      - "Synthetic UPC-E lines for NS 0 and NS 1 decode exactly to 8 characters for every check digit 0-9 (20 exact cases)."
      - "L/G parity is recovered with bit 1 = G at position 1 << (5-i); unknown parity, unknown digit, or invalid guards return '' for UPC-E."
      - "No regression: EAN-13 5901234123457, EAN-8 73127727, UPC-A 901234123457 remain unchanged."
      - "npx jest test/upc-e.test.ts --runInBand --coverage=false passes."
    handoff:
      constraints:
        - "Only edit the type 'E' branch and table constants; leave EAN-13/EAN-8/UPC-A parsing untouched."
        - "The decoder mutates its lines array; tests must pass fresh arrays."
        - "Do not regenerate tracked src/**/*.js files."
      relevant_context:
        - "src/ean/index.ts:60-110 contains the current type E splice(20,5) and wrong expansion."
        - "UPC-E total runs: 3 start + 24 payload + 6 end guard; pop(3) then splice(24,3) leaves 24."
      high_risk_signals:
        - "UPC-E check-digit mapping is easy to invert; tests must assert both number systems."
      critic_signals: []

