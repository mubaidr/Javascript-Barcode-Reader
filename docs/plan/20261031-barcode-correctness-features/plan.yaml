plan_id: 20261031-barcode-correctness-features
status: pending
tldr: |
  Harden all single-track decoders and image utilities, correct UPC-E parity/check-digit decoding,
  add opt-in EAN/UPC checksum validation, add a Code 11 decoder, make locateBarcode and detectRotation
  functional, then update README and verify. Wave 1 fans out over disjoint files; src/index.ts is
  serialized through waves 2 and 3.
created_at: '2026-10-31'
created_by: gem-planner
revision: 0
replan_count: 0
planner_revision_used: false

decisions:
  - "Wave 1 contains ten disjoint decoder/utility tasks; src/index.ts is not touched."
  - "src/index.ts is single-owner in wave 2 (checksum + Code 11 dispatch) and wave 3 (locate/rotation) to keep the file conflict-free."
  - "Code 11 pattern/decoder and BARCODE_DECODERS enum are added in wave 1; the src/index.ts switch is added in wave 2; README is updated only in wave 4 after behavior is final."
  - "validateChecksum invalid or incomplete results are treated as an empty decode (''), not a throw; omitted/false preserves today's output."
  - "detectRotation retries explicit 90/180/270 orientations after the normal scan yields no complete result; it does not gate retries on detectBarcodeRegion.rotation."
  - "locateBarcode crops only when the option is true; default scan path stays unchanged apart from the scan-range clamp bug fix."
  - "applyAdaptiveThreshold stays in-place because src/index.ts consumes the mutated buffer and is owned by later waves; copying would require an index.ts change outside this task."
  - "No shared synthetic-fixture helper: parallel test files own local builders, avoiding a cross-task helper file."
  - "MSI and Pharmacode tests use module/run-length builders so exact values are asserted instead of toBeDefined."
  - "No changes to dist/, docs/ except this plan, node_modules/, generated typedoc, or add 2D symbologies."

assumptions:
  - "Jest resolves .ts before .js (moduleFileExtensions ['ts','js']), so src/**/*.ts and new test/*.test.ts files are authoritative."
  - "test/index.test.js is a tracked compiled duplicate; new tests go in new files and existing exact expectations there are not changed."
  - "The existing sample images and their expected outputs remain stable, including EAN-13 5901234123457."
  - "jsdom does not provide a working canvas 2D implementation, so image/rotation tests use pure ImageDataLike buffers and pure helpers rather than canvas."
  - "New test files are self-contained and may use Jimp only where the existing suite already uses it."

