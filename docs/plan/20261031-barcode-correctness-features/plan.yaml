      unknown 9-bit pattern. Harden checksum lookups so an unresolved char cannot become index -1.
      Add test/code93-robustness.test.ts covering empty/all-zero lines, zero-width runs, unknown
      9-bit patterns, valid synthetic symbols, and regression expectations 123ABC/WIKIPEDIA via the
      existing sample path.
