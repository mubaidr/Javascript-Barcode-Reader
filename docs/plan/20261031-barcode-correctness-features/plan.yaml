  - id: t12-locate-rotation
    title: Make locateBarcode and detectRotation functional
    description: |
      Modify src/utilities/barcodeDetection.ts and src/index.ts. Fix cropBarcodeRegion padding to
      use inclusive end coordinates as end-exclusive (endX + 1 + 5, endY + 1 + 5) and clamp all
      bounds. Add an exported getScanRange(height, row) helper that returns a start row clamped to
      [0, height-1] and rowsToScan <= remaining height; use it in src/index.ts so a slice never
      spans past the image (prevents getLines inferring channels=2). When locateBarcode is true,
      call detectBarcodeRegion and crop with cropBarcodeRegion before applying the optional
      adaptive threshold and scanning. Implement pure-JS
      90/180/270 rotation in rotateImageData for at least 3/4-channel data with exact pixel
      mapping and swapped dimensions; non-cardinal angles may stay unsupported. Wrap each decoder
      call in try/catch and continue to the next scan line/orientation. When detectRotation is
      true, scan the normal orientation first, then retry 90/180/270 if no complete result was
      found. Default behavior when both options are off must remain unchanged.
      Add test/barcodeDetection.test.ts for crop dimensions, getScanRange edges, and exact
      90/180/270 pixel/dimension results; test/locate-rotation.test.ts for an offset/rotated
      synthetic EAN-13 decoded with the options; test/decoder-error-isolation.test.ts with a
      module mock whose decoder throws, asserting the reader does not reject for that reason.
    wave: 3
    depends_on: [t06-getlines, t11-checksum-dispatch]
    agent: gem-implementer
    status: pending
    retries_used: 0
    acceptance_criteria:
      - "cropBarcodeRegion on a known region returns exact width/height with 5px padding and no out-of-bounds reads."
      - "getScanRange clamps height 1, 2, and 100 correctly; every slice end is <= data length and rowsToScan never exceeds remaining height."
      - "locateBarcode: true decodes an offset synthetic EAN-13 5901234123457; crop dimensions match the computed region."
      - "rotateImageData returns exact pixels and swapped dimensions for 90/270, exact reversed pixels for 180, preserving alpha on 4-channel data."
      - "detectRotation: true recovers a 90-degree-rotated synthetic barcode after the normal scan fails; options off still decode existing samples unchanged."
      - "A throwing decoder is caught per scan line and does not reject the outer request; other scan lines remain eligible."
      - "npx jest test/barcodeDetection.test.ts test/locate-rotation.test.ts test/decoder-error-isolation.test.ts --runInBand --coverage=false passes."
    handoff:
      constraints:
        - "Only t12 owns src/index.ts in wave 3; do not edit README or decoders."
        - "Do not use canvas APIs in rotateImageData; jsdom and Node must both work."
        - "Keep options opt-in; no new default cropping/rotation/retry."
        - "Do not change public output formats."
      relevant_context:
