  - id: t11-checksum-dispatch
    title: Add validateChecksum and Code 11 dispatch
    description: |
      Add src/utilities/checksum.ts exporting isValidChecksum(value: string, barcodeType: string):
      boolean. It applies GS1 mod-10 to EAN-13/EAN-8/UPC-A and expands raw 8-digit UPC-E to a
      12-digit UPC-A before validating its check. Add options.validateChecksum?: boolean to
      src/index.ts, default false. After a
      decoder returns a non-empty result, when validateChecksum is true and the barcode is in the
      EAN/UPC family, treat an invalid result as no result. False/omitted output stays identical.
      Also import the new Code 11 decoder and add BARCODE_DECODERS['code-11'] to the switch.
      Add test/checksum.test.ts for valid/invalid EAN-13/EAN-8/UPC-A and all UPC-E expansion
      cases, plus an integration test on ean-13.jpg with validateChecksum true. Add
      test/code-11-dispatch.test.ts that paints a synthetic Code 11 image into ImageDataLike and
      verifies the reader dispatches to the decoder.
    wave: 2
    depends_on: [t09-upc-e, t10-code11-decoder]
    agent: gem-implementer
    status: pending
    retries_used: 0
    acceptance_criteria:
      - "isValidChecksum returns true for 5901234123457, 73127727, and 901234123457; false when the final digit is changed."
      - "Raw UPC-E expansion covers payload last digits 0,1,2,3,4,5-9 and validates the expanded UPC-A check digit."
      - "validateChecksum: true on ean-13.jpg returns 5901234123457; omitted/false produces the same outputs as before across all existing samples."
      - "Code 11 dispatch decodes a synthetic painted image to 123-45 and invalid enum values still throw the existing error."
      - "npx jest test/checksum.test.ts test/code-11-dispatch.test.ts --runInBand --coverage=false passes."
    handoff:
      constraints:
